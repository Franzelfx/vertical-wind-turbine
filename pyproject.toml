[project]
name = "vawt"
version = "0.1.0"
description = "Specification and sizing model of a small vertical-axis wind turbine charging a 3S Li-ion pack"
readme = "README.md"
requires-python = ">=3.11"  # spec.py is also imported by FreeCAD's bundled Python 3.11
dependencies = []  # the core stays dependency-free, so sizing runs in milliseconds

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
vawt = "vawt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vawt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "tools"]
extend-exclude = ["tools/schgen.py"]  # copied unchanged in style from battery-swap-drone

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/vawt/io/docs.py" = ["E501"]  # page text reads better unwrapped than broken for the template
"tools/kicad_place.py" = ["B905", "UP"]  # runs under KiCad's Python 3.9
