# What runs without FreeCAD, KiCad, the licensed rotor or the booklet's font: lint, the sizing model,
# requirements and docs. `tools/run-checks.sh` on a workstation remains the full check (ADR-010).
name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  model-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - name: Model, requirements and docs
        run: >
          uv run --locked pytest -q
          --ignore=tests/test_cad.py
          --ignore=tests/test_electronics.py
          --deselect=tests/test_report.py::test_booklet_builds_without_warnings
